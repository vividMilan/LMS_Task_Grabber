name: LMS Task Grabber CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      # Fail CI if code is not formatted according to Ruff
      - name: Check Code Formatting & Linting
        run: |
          ruff check src/
          ruff format --check src/

      # Install Playwright ONLY when actually running tests
      # - name: Install Playwright Browsers
      #   run: playwright install --with-deps chromium

      # - name: Run Test Suite
      #   run: pytest tests/